// Share the proven source/dictionaries without duplicating the legacy modules.
group = 'com.tistory.devyongsik'
version = '1.0.0'
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
sourceSets {
    main {
        java.srcDir '../korean-analyzer-9.x/src/main/java'
        resources.srcDir '../korean-analyzer-9.x/src/main/resources'
    }
    test {
        java.srcDir '../korean-analyzer-9.x/src/test/java'
        resources.srcDir '../korean-analyzer-9.x/src/test/resources'
    }
}
dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.apache.lucene:lucene-core:10.4.0'
    implementation 'org.apache.lucene:lucene-analysis-common:10.4.0'
    implementation 'org.apache.lucene:lucene-queryparser:10.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.guava:guava:33.2.0-jre'
}
